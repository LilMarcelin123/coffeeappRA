services:
  mysql:
    image: mariadb:10.6.4-focal
    container_name: coffee_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bd_rincon_arboleda
      MYSQL_USER: coffee_user
      MYSQL_PASSWORD: coffee_pass
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: coffee_app
    ports:
      - "8082:8080"
    depends_on:
      - mysql
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mariadb://mysql:3306/bd_rincon_arboleda?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: coffee_user
      SPRING_DATASOURCE_PASSWORD: coffee_pass

  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: cafeteria_key_2024
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://redis:6379"
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_URL: "http://app:8080/webhook/whatsapp"
      WEBHOOK_GLOBAL_ENABLED: "true"
      LOG_LEVEL: INFO
      DEL_INSTANCE: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://postgres:postgres@evolution-postgres:5432/evolution"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1035194821"
    volumes:
      - evolution_data:/evolution/data
      - evolution_instances:/evolution/instances
    depends_on:
      - redis
      - evolution-postgres

  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      WEBHOOK_URL: http://localhost:5678
      GENERIC_TIMEZONE: America/Mexico_City
      TZ: America/Mexico_City
      N8N_ENCRYPTION_KEY: cambia_esta_clave_secreta
      N8N_BASIC_AUTH_ACTIVE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - evolution-api

volumes:
  mysql_data:
  evolution_data:
  evolution_instances:
  redis_data:
  evolution_pg_data:
  n8n_data: