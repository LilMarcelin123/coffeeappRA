services:
  mysql:
    image: mariadb:10.6.4-focal
    container_name: coffee_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bd_rincon_arboleda
      MYSQL_USER: coffee_user
      MYSQL_PASSWORD: coffee_pass
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: coffee_app
    ports:
      - "8082:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mysql:3306/bd_rincon_arboleda?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: coffee_user
      SPRING_DATASOURCE_PASSWORD: coffee_pass

  evolution-api:
    image: atendai/evolution-api:v1.7.4
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: cafeteria_key_2024
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: "http://n8n:5678/webhook/whatsapp"
      WEBHOOK_GLOBAL_ENABLED: "false"
      LOG_LEVEL: ERROR
      DEL_INSTANCE: "false"
    volumes:
      - evolution_data:/evolution/data
      - evolution_instances:/evolution/instances
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      WEBHOOK_URL: http://localhost:5678
      GENERIC_TIMEZONE: America/Mexico_City
      TZ: America/Mexico_City
      N8N_ENCRYPTION_KEY: cambia_esta_clave_secreta
      N8N_BASIC_AUTH_ACTIVE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - evolution-api

volumes:
  mysql_data:
  evolution_data:
  evolution_instances:
  redis_data:
  n8n_data: