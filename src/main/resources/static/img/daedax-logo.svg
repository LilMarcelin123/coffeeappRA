<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img"
     aria-label="DAEDAX">
  <!-- Isotipo del POS: tinta ICARIX con el acento azul.
       Va en SVG para que escale en el hero y en el login sin pesar. -->
  <defs>
    <linearGradient id="tinta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1A2F"/>
      <stop offset="1" stop-color="#15325C"/>
    </linearGradient>
  </defs>

  <rect width="320" height="320" rx="52" fill="url(#tinta)"/>

  <!-- Marco tenue, para que el cuadro no flote sobre fondos claros -->
  <rect x="10" y="10" width="300" height="300" rx="44"
        fill="none" stroke="#2E86F5" stroke-opacity=".38" stroke-width="2"/>

  <!-- Monograma -->
  <text x="160" y="178" text-anchor="middle"
        font-family="'Michroma','Poppins',system-ui,sans-serif"
        font-size="86" font-weight="700" letter-spacing="2"
        fill="#F2F7FF">DX</text>

  <!-- Filo azul -->
  <rect x="104" y="206" width="112" height="5" rx="2.5" fill="#2E86F5"/>

  <text x="160" y="244" text-anchor="middle"
        font-family="'Poppins',system-ui,sans-serif"
        font-size="21" font-weight="500" letter-spacing="7"
        fill="#9CC3F5">DÆDAX</text>
</svg>
