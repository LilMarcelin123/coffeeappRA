<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Rincón en las Arboledas | Inicio de sesión</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/temporada.css}">
</head>

<body th:attr="data-tema=${tema}">

<!-- Foto del local -->
<div class="fondo" aria-hidden="true">
    <img th:src="@{/img/IMG_1450.jpg}" src="/img/IMG_1450.jpg" alt="">
</div>

<div th:if="${tema == 'halloween'}"
     th:replace="~{fragmentos/temporada :: halloween}"></div>

<main class="centrado">
    <div class="acceso">

        <img class="acceso__logo"
             th:src="@{/img/arboledasLogo.jpg}" src="/img/arboledasLogo.jpg"
             alt="El Rincón en las Arboledas">

        <p class="acceso__eyebrow">Bienvenido</p>
        <h1 class="acceso__titulo">Inicia <em>sesión</em></h1>
        <div class="acceso__filo" aria-hidden="true"></div>
        <p class="acceso__bajada">
            Acceso para personal de <strong>El Rincón en las Arboledas</strong>
        </p>

        <form th:action="@{/login}" method="post">

            <div class="campo">
                <label class="campo__label" for="username">Usuario</label>
                <i class="bi bi-person campo__icono" aria-hidden="true"></i>
                <input class="campo__input"
                       type="text" id="username" name="username"
                       placeholder="Ingresa tu usuario"
                       autocomplete="username" required autofocus>
            </div>

            <div class="campo">
                <label class="campo__label" for="password">Contraseña</label>
                <i class="bi bi-lock campo__icono" aria-hidden="true"></i>
                <input class="campo__input"
                       type="password" id="password" name="password"
                       placeholder="Ingresa tu contraseña"
                       autocomplete="current-password" required>
                <button type="button" class="campo__ojo" id="verPassword"
                        tabindex="-1" aria-label="Mostrar contraseña">
                    <i class="bi bi-eye" aria-hidden="true"></i>
                </button>
            </div>

            <button class="btn-entrar" type="submit">
                <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
                Iniciar sesión
            </button>

        </form>

        <div role="status">
            <div th:if="${param.logout}" class="aviso aviso--ok">
                <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
                Sesión cerrada correctamente.
            </div>
            <div th:if="${param.error}" class="aviso aviso--error">
                <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>
                Usuario o contraseña incorrectos. Intenta de nuevo.
            </div>
        </div>

        <p class="acceso__pie">
            <i class="bi bi-cup-hot-fill" aria-hidden="true"></i>
            Sistema interno de cafetería
        </p>

    </div>
</main>

<script type="module" th:src="@{/js/Login/login.js}"></script>

</body>
</html>
