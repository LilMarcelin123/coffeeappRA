<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Rincón en las Arboledas | Inicio de Sesión</title>

    <!-- Bootstrap 5 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          crossorigin="anonymous"/>

    <style>
        /* ===== Fondo general ===== */
		body {
		    height: 100vh;
		    margin: 0;
		    background-image: url('/img/taza_arboledas.jpg'); 
		    background-size: cover;     
		    background-position: center;
		    background-repeat: no-repeat; 
		    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
		}

        @keyframes gradientMove {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        /* Capa para centrar todo */
        .center-wrapper {
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* ===== Card de login ===== */
        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 35px 38px 28px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.28);
            backdrop-filter: blur(8px);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(18px);}
            to {opacity: 1; transform: translateY(0);}
        }

        .brand-logo {
            width: 220px;
            height: auto;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #777;
        }

        /* ===== Inputs y botón ===== */
        .form-floating > .form-control {
            border-radius: 12px;
        }

        .form-floating > label {
            color: #7b7b7b;
        }

        .btn-custom {
            background-color: #80bd01;
            color: white;
            padding: 11px;
            font-size: 1.05rem;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
        }

        .btn-custom:hover {
            background-color: #6a9c01;
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.18);
        }

        .btn-custom:active {
            transform: translateY(0);
            box-shadow: none;
        }

        /* Mensajes */
        .login-messages .alert {
            padding: 0.55rem 0.75rem;
            font-size: 0.9rem;
            border-radius: 10px;
        }

        /* Texto de pie */
        .login-footer-text {
            font-size: 0.8rem;
            color: #999;
        }

        @media (max-width: 576px) {
            .login-card {
                padding: 28px 22px 22px;
            }
            .brand-logo {
                width: 190px;
            }
        }
    </style>
</head>

<body>

<div class="center-wrapper">

    <div class="login-card">

        <!-- LOGO, TÍTULO Y SUBTÍTULO -->
        <div class="text-center mb-4">
            <!-- Cambia la imagen por la tuya -->
            <img class="brand-logo" th:src="@{/img/IMG_8220.jpg}" alt="El Rincón en las Arboledas">
            <h3 class="fw-bold mt-3 mb-1">Inicio de sesión</h3>
            <p class="subtitle mb-0">
                Acceso para personal de <strong>El Rincón en las Arboledas</strong>
            </p>
        </div>

        <!-- FORMULARIO -->
        <form th:action="@{/login}" method="post" class="d-flex flex-column gap-3">

            <div class="form-floating">
                <input type="text"
                       class="form-control"
                       id="username"
                       name="username"
                       placeholder="usuario">
                <label for="username">
                    <i class="fa fa-user me-1"></i> Usuario
                </label>
            </div>

            <div class="form-floating">
                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="contraseña">
                <label for="password">
                    <i class="fa fa-lock me-1"></i> Contraseña
                </label>
            </div>

            <button class="btn btn-custom w-100 mt-1" type="submit">
                Iniciar sesión
            </button>
        </form>

        <!-- MENSAJES -->
        <div class="login-messages mt-3">

            <div th:if="${param.logout}"
                 class="alert alert-success text-center"
                 id="logoutAlert">
                Sesión cerrada correctamente.
            </div>

            <div th:if="${param.error}"
                 class="alert alert-danger text-center"
                 id="errorAlert">
                Usuario o contraseña incorrectos.
            </div>

        </div>

        <!-- PIE -->
        <div class="text-center mt-2 login-footer-text">
            <span><i class="fa fa-mug-hot me-1"></i> Sistema interno de cafetería</span>
        </div>

    </div>
</div>

<!-- Ocultar alertas automáticamente -->
<script>
    setTimeout(() => {
        const logoutAlert = document.getElementById('logoutAlert');
        const errorAlert = document.getElementById('errorAlert');
        if (logoutAlert) logoutAlert.style.display = 'none';
        if (errorAlert) errorAlert.style.display = 'none';
    }, 2500);
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

</body>
</html>
