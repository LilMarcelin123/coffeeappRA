<!DOCTYPE html>
<!--
  fragmentos/temporada.html
  Decoracion de temporada.

  Solo marcado: donde va cada adorno y que es. El tamaño, la posicion y
  el movimiento viven en css/temporada.css.

  Todo es decorativo, asi que va con aria-hidden: un lector de pantalla
  no tiene por que anunciar telarañas ni esferas.

  Cada temporada tiene dos fragmentos con el nombre del tema:
    <tema>        → pantalla completa (login)
    <tema>-banda  → dentro del encabezado de las pantallas de trabajo
  Las vistas los piden por nombre con el atributo `tema` que pone
  TemporadaAdvice; "ninguna" y "ninguna-banda" existen vacios.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
