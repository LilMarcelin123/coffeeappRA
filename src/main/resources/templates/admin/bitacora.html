<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/gestion/fragmentos :: cabeza('Bitácora — Módulo de Gestión', 'bitacora')}"></head>

<body class="gestion-body" th:attr="data-hoy-negocio=${hoyNegocio}">

<header th:replace="~{admin/gestion/fragmentos :: encabezado(
            'bi-journal-text',
            'Bitácora de ventas',
            'Escoge un día del calendario para ver sus órdenes.')}"></header>

<main class="gestion-main">

    <!-- ── Mes ────────────────────────────────────────────── -->
    <section class="periodo vidrio" aria-label="Mes a consultar">
        <span class="rotulo periodo__label">Mes</span>

        <div class="mes">
            <button type="button" class="mes__btn" id="btnMesAnterior" aria-label="Mes anterior">
                <i class="bi bi-chevron-left"></i>
            </button>
            <b class="mes__titulo" id="mesTitulo">—</b>
            <button type="button" class="mes__btn" id="btnMesSiguiente" aria-label="Mes siguiente">
                <i class="bi bi-chevron-right"></i>
            </button>
        </div>

        <a th:href="@{/admin/gestion}" class="volver">
            <i class="bi bi-arrow-left"></i> <span>Volver al módulo</span>
        </a>

        <p class="periodo__leyenda" id="periodoLeyenda">Cargando…</p>
    </section>

    <!-- ── Calendario ─────────────────────────────────────── -->
    <section class="calendario-wrap vidrio" aria-label="Calendario de ventas">
        <div class="calendario__dias" aria-hidden="true">
            <span>Lun</span><span>Mar</span><span>Mié</span>
            <span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
        </div>

        <div class="calendario" id="calendario"></div>

        <p class="calendario__pie">
            El día corre de 1 a 1 de la madrugada. Los días sin venta aparecen vacíos:
            el negocio cierra los lunes y un cero falso torcería los promedios.
        </p>
    </section>

    <!-- ── Día seleccionado ───────────────────────────────── -->
    <section class="dia-panel vidrio" id="diaPanel" hidden aria-live="polite">
        <div class="dia-panel__cabecera">
            <div>
                <b class="dia-panel__titulo" id="diaTitulo">—</b>
                <span class="dia-panel__resumen" id="diaResumen"></span>
            </div>
            <button type="button" class="dia-panel__cerrar" id="btnCerrarDia" aria-label="Cerrar el día">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
        <div class="ordenes" id="ordenesLista"></div>
    </section>

    <!-- ── Plantillas ─────────────────────────────────────── -->
    <template id="tplCelda">
        <button class="celda" type="button">
            <span class="celda__dia cifra"></span>
            <span class="celda__venta cifra"></span>
            <span class="celda__ordenes"></span>
            <span class="celda__nada">—</span>
            <span class="celda__barra"><i></i></span>
        </button>
    </template>

    <template id="tplOrden">
        <button class="orden" type="button">
            <span class="orden__hora cifra"></span>
            <span class="orden__cliente"></span>
            <span class="orden__tags"></span>
            <b class="orden__total cifra"></b>
        </button>
    </template>

    <template id="tplItem">
        <div class="item">
            <span class="item__cant cifra"></span>
            <span class="item__nombre">
                <span class="item__titulo"></span>
                <span class="item__detalle"></span>
            </span>
            <b class="item__total cifra"></b>
        </div>
    </template>

</main>

<!-- ── Detalle de la orden: el único modal del módulo ─────── -->
<div class="modal fade" id="modalOrden" tabindex="-1" aria-hidden="true" aria-labelledby="modalOrdenTitulo">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-orden">
            <div class="modal-header">
                <h2 class="modal-title h5" id="modalOrdenTitulo">Orden</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <div class="orden-meta" id="ordenMeta"></div>
                <div class="items" id="ordenItems"></div>
            </div>
            <div class="modal-footer">
                <span class="orden-total-final cifra" id="ordenTotalFinal"></span>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{admin/gestion/fragmentos :: pie}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" th:src="@{/js/Gestion/bitacora.js}"></script>

</body>
</html>
