<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/gestion/fragmentos :: cabeza('Módulo de Gestión — Rincón Arboledas', 'panel')}"></head>

<body class="gestion-body" th:attr="data-hoy-negocio=${hoyNegocio}">

<header th:replace="~{admin/gestion/fragmentos :: encabezado(
            'bi-graph-up-arrow',
            'Cómo va el negocio',
            'Ventas, cortes y productos. El día corre de 1 a 1 de la madrugada.')}"></header>

<main class="gestion-main">

    <section th:replace="~{admin/gestion/fragmentos :: periodo(
                'hoy=Hoy|ayer=Ayer|7dias=7 días|mes=Este mes|rango=Rango',
                '/admin/inicio', 'Volver al panel')}"></section>

    <!-- ── Reloj de secciones ─────────────────────────────── -->
    <section class="reloj" aria-label="Secciones del módulo">

        <!-- Núcleo: los números del periodo -->
        <div class="nucleo vidrio--hondo" id="nucleo" data-estado="cargando">
            <span class="nucleo__label">Venta del periodo</span>
            <span class="nucleo__venta cifra" id="kpiVenta">$0.00</span>
            <span class="nucleo__comparativo nucleo__comparativo--plano" id="kpiComparativo">
                sin comparativo
            </span>

            <div class="nucleo__secundarios">
                <div class="nucleo__dato">
                    <b class="cifra" id="kpiOrdenes">0</b>
                    <small>Órdenes</small>
                </div>
                <div class="nucleo__dato">
                    <b class="cifra" id="kpiTicket">$0</b>
                    <small>Ticket</small>
                </div>
                <div class="nucleo__dato">
                    <b class="cifra" id="kpiDias">0</b>
                    <small>Días</small>
                </div>
            </div>

            <p class="nucleo__aviso" id="nucleoAviso"></p>
        </div>

        <!-- Satélites. El orden es por uso: arriba lo de todos los días. -->
        <div class="satelites">

            <a class="satelite satelite--h12" href="/admin/gestion/cierres">
                <i class="bi bi-cash-coin satelite__icono"></i>
                <span class="satelite__nombre">Cierres</span>
            </a>

            <a class="satelite satelite--h13" href="/admin/gestion/bitacora">
                <i class="bi bi-journal-text satelite__icono"></i>
                <span class="satelite__nombre">Bitácora</span>
            </a>

            <span class="satelite satelite--h15 satelite--pendiente" aria-disabled="true">
                <i class="bi bi-cup-hot satelite__icono"></i>
                <span class="satelite__nombre">Productos</span>
                <span class="satelite__pronto">Pronto</span>
            </span>

            <span class="satelite satelite--h17 satelite--pendiente" aria-disabled="true">
                <i class="bi bi-activity satelite__icono"></i>
                <span class="satelite__nombre">Ritmo</span>
                <span class="satelite__pronto">Pronto</span>
            </span>

            <span class="satelite satelite--h18 satelite--pendiente" aria-disabled="true">
                <i class="bi bi-diagram-3 satelite__icono"></i>
                <span class="satelite__nombre">Canales</span>
                <span class="satelite__pronto">Pronto</span>
            </span>

            <span class="satelite satelite--h19 satelite--pendiente" aria-disabled="true">
                <i class="bi bi-basket satelite__icono"></i>
                <span class="satelite__nombre">Insumos</span>
                <span class="satelite__pronto">Pronto</span>
            </span>

            <span class="satelite satelite--h21 satelite--pendiente" aria-disabled="true">
                <i class="bi bi-whatsapp satelite__icono"></i>
                <span class="satelite__nombre">Clientes</span>
                <span class="satelite__pronto">Pronto</span>
            </span>

            <span class="satelite satelite--h23 satelite--pendiente" aria-disabled="true">
                <i class="bi bi-shield-check satelite__icono"></i>
                <span class="satelite__nombre">Auditoría</span>
                <span class="satelite__pronto">Pronto</span>
            </span>

        </div>
    </section>

</main>

<footer th:replace="~{admin/gestion/fragmentos :: pie}"></footer>

<script type="module" th:src="@{/js/Gestion/panel.js}"></script>

</body>
</html>
