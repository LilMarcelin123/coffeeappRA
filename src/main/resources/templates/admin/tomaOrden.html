<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!--  SUPERIOR CON FONDO E LOGOS -->
<header class="container-fluid px-0">
    <div class="hero-section" style="background-image: url('/img/granoscafe.jpg');">
        <div class="hero-overlay">
            <div class="container">
                <div class="row align-items-center">
                    <!-- Texto principal -->
                    <div class="col-md-7">
                        <div class="mb-2">
                            <span class="badge-rol">
                                Panel Toma de Orden
                            </span>
                        </div>
                        <h1 class="hero-title mb-2">
                            Selección de Productos
                            
                        </h1>
					

                    </div>

                    <!-- Logos -->
                    <div class="col-md-5 mt-3 mt-md-0">
                        <div class="logo-stack">
                            <!-- Logo del negocio -->
                            <div class="logo-circle">
                                <img th:src="@{/img/arboledasLogo.jpg}" alt="Logo negocio">
                            </div>

                           
                        </div>
                        <p class="text-end small mt-2 opacity-75 d-none d-md-block">
                            <span th:text="${nombreNegocio}">Nombre del negocio</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- CUERPO PRINCIPAL -->
<main class="container card-main">
	<div class="glass-card p-4 p-md-4 mb-4">
		<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
			<div>
				<h2 class="h4 mb-0">
					<span th:text="${nombreUsuario}">Usuario</span>
				</h2>
				<p class="text-muted mb-0 subtitle-small">
					Selecciona en la parte debajo los productos y subproductos
					y al final confirma para guardar el producto en la orden.
				</p>

				<div id="resultadoProceso" class="mt-3">
				    <div class="alert alert-success p-2 mb-0">
				        🧾 Orden iniciada: 
						<strong th:text="${idOrden}"></strong>
				    </div>
					<input type="hidden" id="idOrden" th:value="${idOrden}">
				</div>
			</div>
<!--			
			<div>
				<a class="btn btn-outline-danger btn-sm" th:href="@{/admin/inicio}">
					Cerrar Orden
                </a>
            </div>
-->			
        </div>

        <hr>

        <!-- MENÚ PRINCIPAL -->
        <div class="row g-3">

            <!-- Opción: Toma de órdenes -->
            <div class="col-md-4">
         
            </div>

            <!-- Opción: Gestión de catálogos -->
			<div class="col-md-4">

			    <!-- Tarjeta -->
			    <div class="panel-card h-100 d-flex flex-column justify-content-between p-3">

			        <!-- Select de categorías -->
			        <div>
			            <select id='selectCategoria' name="idCategoria" class="form-select" required>
			                <option value="">Seleccione una categoría</option>
			                <option th:each="cat : ${categorias}"
			                        th:value="${cat.idcategoria}"
			                        th:text="${cat.nnombrecategoria}">
			                </option>
			            </select>
			        </div>

			        <!-- SELECT de productos dinámico (DEBE estar fuera del <a>) -->
						
						<!-- SELECT de productos dinámico -->
						<div id="contenedorProductos" class="mt-3 text-center"></div>

						<!-- Cantidad del producto (abajo y centrado) -->
						<div class="mt-3 d-flex justify-content-center">
						    <div style="width: 150px;">
						  
						        <input type="number"
						               class="form-control text-center"
						               name="cantidadProducto"
						               id="cantidadProducto"
						               min="1"
						               max="10"
						               value="1">
						    </div>
						</div>

						<div id="contenedorSubcategoria" class="mt-2 text-center"></div>
						
						<div id="contenedorOpcionesExtras" class="mt-3"></div>
						<!-- Botón -->
						<button id="btnAñadeItem" class="btn btn-lg w-100" style="background:rgb(84, 145, 115); color:white;">
							<p>
								Añadir Item
							<i class="bi bi-layers-fill"></i>
							</p>
						</button>

			    </div>

			</div>

            <!-- Opción: Gestión de usuarios -->
            <div class="col-md-4">
       
            </div>

        </div>
    </div>
	

	
</main>

<!-- FOOTER -->
<footer class="footer-custom">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
        <span>
            &copy; 2025 ·
            <span th:text="${nombreNegocio}">Nombre del negocio</span>.
            Todos los derechos reservados.
        </span>
        <span class="footer-right">
            Desarrollado por
			
            <a th:href="@{/}" target="_blank">Tu marca</a>
		
        </span>
		<!-- Tu logo / marca desarrollador -->
				<div class="logo-circle">
		           <img th:src="@{/img/icarous_logo.jpg}" alt="Logo desarrollador">
		       </div>
    </div>
</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<div th:replace="admin/DetalleOrdenes :: modalConfirmación"></div>

<script th:src="@{/js/Ordenes/InicioOrden.js}"></script>
<script th:src="@{/js/Ordenes/TomaOrden.js}"></script>

</body>
</html>
