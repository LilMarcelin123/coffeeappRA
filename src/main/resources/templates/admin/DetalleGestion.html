<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>


<div th:fragment="modalEditar">
	<div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">✏️ Editar registro</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label">Nombre</label>
            <input id="nombre" class="form-control">
          </div>

          <div class="col-md-6">
            <label class="form-label">Precio</label>
			<input id="precio" type="number" step="0.01" class="form-control" required>
          </div>

          <div class="col-md-12">
            <label class="form-label">Descripción</label>
            <input id="descripcion" class="form-control">
          </div>

          <div class="col-md-6">
            <label class="form-label">Rol</label>
            <select id="rol" class="form-select">
              <option value="">Seleccione</option>
              <option value="1">Admin</option>
              <option value="2">Usuario</option>
            </select>
          </div>

        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button id="btnGuardarCambios" class="btn btn-success">
          💾 Guardar
        </button>
      </div>

    </div>
  </div>
</div>  
</div>





</body>
</html>
