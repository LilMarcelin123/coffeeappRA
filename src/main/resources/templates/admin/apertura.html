<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Rincón en las Arboledas | Apertura de caja</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/apertura.css}">
    <link rel="stylesheet" th:href="@{/css/temporada.css}">
</head>

<!--
  Apertura de caja.
  Lo primero que ve el administrador despues del corte de la 01:00.
  Mientras no se registre, no se puede tomar ordenes ni entrar a los
  modulos (AperturaCajaInterceptor). Misma piel que el login.
-->
<body th:attr="data-tema=${tema}">

<div class="fondo" aria-hidden="true">
    <img th:src="@{/img/IMG_1450.jpg}" src="/img/IMG_1450.jpg" alt="">
</div>

<div th:replace="~{fragmentos/temporada :: __${tema ?: 'ninguna'}__}"></div>

<main class="centrado">
    <div class="acceso">

        <img class="acceso__logo"
             th:src="@{/img/arboledasLogo.jpg}" src="/img/arboledasLogo.jpg"
             alt="El Rincón en las Arboledas">

        <p class="acceso__eyebrow">
            Nuevo día · <span th:text="${dia}">18/11/2026</span>
        </p>
        <h1 class="acceso__titulo">Apertura de <em>caja</em></h1>
        <div class="acceso__filo" aria-hidden="true"></div>
        <p class="acceso__bajada">
            Antes de tomar órdenes, registra con cuánto <strong>cambio</strong> abre la caja hoy.
        </p>

        <form th:action="@{/admin/apertura}" method="post" id="formApertura" novalidate>

            <div class="campo">
                <label class="campo__label" for="fondo">Fondo de caja (cambio)</label>
                <i class="bi bi-cash-coin campo__icono" aria-hidden="true"></i>
                <input class="campo__input apertura__monto"
                       type="number" id="fondo" name="fondo"
                       inputmode="decimal" min="0" max="20000" step="0.50"
                       placeholder="0.00"
                       th:value="${fondo}"
                       required autofocus>
            </div>

            <div class="campo">
                <label class="campo__label" for="responsable">¿Quién lo registra?</label>
                <i class="bi bi-person-check campo__icono" aria-hidden="true"></i>
                <input class="campo__input"
                       type="text" id="responsable" name="responsable"
                       maxlength="120" autocomplete="name"
                       placeholder="Nombre y apellido"
                       th:value="${responsable}"
                       required>
            </div>

            <p class="apertura__nota">
                <i class="bi bi-shield-check" aria-hidden="true"></i>
                El monto queda firmado con este nombre y no se puede cambiar después.
                Cuéntalo antes de guardarlo.
            </p>

            <button class="btn-entrar" type="submit" id="btnAbrir">
                <i class="bi bi-unlock" aria-hidden="true"></i>
                Abrir caja
            </button>

        </form>

        <div role="status">
            <div th:if="${error}" class="aviso aviso--error">
                <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>
                <span th:text="${error}">Error</span>
            </div>
        </div>

        <form th:action="@{/logout}" method="post" class="apertura__salir">
            <span>Sesión: <strong th:text="${nombreUsuario}">admin</strong></span>
            <button type="submit"><i class="bi bi-box-arrow-left" aria-hidden="true"></i> Salir</button>
        </form>

    </div>
</main>

<script>
/* Confirmacion: el fondo no se puede editar despues. */
document.getElementById('formApertura').addEventListener('submit', function (e) {
    var fondo = document.getElementById('fondo');
    var resp  = document.getElementById('responsable');
    var monto = parseFloat(fondo.value);

    if (fondo.value.trim() === '' || isNaN(monto) || monto < 0) {
        e.preventDefault(); fondo.focus(); return;
    }
    if (resp.value.trim().length < 3) {
        e.preventDefault(); resp.focus(); return;
    }
    var texto = 'Abrir caja con $' + monto.toLocaleString('es-MX', {minimumFractionDigits: 2})
              + '\nRegistra: ' + resp.value.trim()
              + '\n\nNo se puede cambiar después. ¿Es correcto?';
    if (!window.confirm(texto)) { e.preventDefault(); return; }
    document.getElementById('btnAbrir').disabled = true;
});
</script>

</body>
</html>
