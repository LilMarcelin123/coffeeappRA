<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Catálogo — Rincón Arboledas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styleCatalogo.css}">

    <style>
        :root {
            --crema:#FDFAF6;--crema-2:#F5EFE6;--cafe-light:#D4B896;
            --cafe-mid:#B8936A;--cafe-dark:#8B5E3C;--cafe-deep:#5C3317;
            --cafe-ink:#3B1F0A;--text-primary:#1A0F08;--text-muted:#8A7060;
            --radius-xl:24px;--radius-lg:16px;--radius-md:12px;
            --shadow-card:0 4px 24px rgba(92,51,23,.08);--blur:blur(20px);
        }
        *,*::before,*::after{box-sizing:border-box;}
        body{font-family:'Poppins',sans-serif;background:var(--crema);color:var(--text-primary);min-height:100vh;margin:0;}

        /* FRANJA imagen */
        .hero-section{position:relative;width:100%;height:110px;background-size:cover;background-position:center 38%;background-repeat:no-repeat;overflow:hidden;}
        .hero-overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(59,31,10,.72),rgba(92,51,23,.45) 50%,rgba(59,31,10,.68));}
        .hero-section::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--cafe-mid),var(--cafe-light),var(--cafe-mid));}
        .hero-content{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(24px,5vw,64px);}
        .hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.30);border-radius:30px;padding:5px 18px;font-size:.70rem;font-weight:700;color:rgba(255,255,255,.92);letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(12px);}
        .hero-logo{width:52px;height:52px;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.30);box-shadow:0 4px 16px rgba(0,0,0,.25);}
        .hero-logo img{width:100%;height:100%;object-fit:cover;}

        /* HEADER BLOCK */
        .header-block{max-width:980px;margin:36px auto 0;padding:0 24px;animation:slideDown .5s ease both;}
        .header-eyebrow{font-size:.70rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--cafe-mid);margin-bottom:6px;}
        .header-main-title{font-family:'Playfair Display',serif;font-size:clamp(2.2rem,4.5vw,3.6rem);font-weight:700;color:var(--cafe-ink);line-height:1.05;margin:0 0 6px;letter-spacing:-.02em;}
        .header-main-title em{font-style:italic;color:var(--cafe-dark);}
        .header-divider{width:64px;height:3px;border-radius:4px;background:linear-gradient(90deg,var(--cafe-mid),var(--cafe-light));margin-top:12px;}

        /* MAIN */
        .page-main{max-width:980px;margin:28px auto 0;padding:0 24px 60px;animation:fadeUp .5s ease .1s both;}

        /* CARDS */
        .panel-card{background:rgba(255,255,255,.94);backdrop-filter:var(--blur);border:1.5px solid rgba(212,184,150,.28);border-radius:var(--radius-xl);box-shadow:var(--shadow-card);padding:32px;margin-bottom:24px;}
        .panel-card-title{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--cafe-deep);margin-bottom:20px;display:flex;align-items:center;gap:12px;}
        .panel-card-title i.icon-badge{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--cafe-light),var(--cafe-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1rem;flex-shrink:0;box-shadow:0 4px 12px rgba(139,94,60,.28);}

        /* TIPO BUTTONS */
        .tipo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
        @media(max-width:640px){.tipo-grid{grid-template-columns:repeat(2,1fr);}}
        .tipo-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 10px;border:2px solid rgba(212,184,150,.3);border-radius:var(--radius-lg);background:rgba(255,255,255,.7);cursor:pointer;transition:all .25s;font-family:'Poppins',sans-serif;font-size:.82rem;font-weight:600;color:var(--text-muted);text-align:center;outline:none;}
        .tipo-btn i{font-size:1.7rem;color:var(--cafe-mid);transition:color .25s,transform .25s;}
        .tipo-btn:hover{border-color:var(--cafe-mid);background:var(--crema-2);color:var(--cafe-dark);transform:translateY(-2px);box-shadow:0 6px 18px rgba(139,94,60,.12);}
        .tipo-btn:hover i{color:var(--cafe-dark);transform:scale(1.1);}
        .tipo-btn.activo{border-color:var(--cafe-dark);background:linear-gradient(135deg,rgba(212,184,150,.18),rgba(139,94,60,.08));color:var(--cafe-deep);box-shadow:0 4px 18px rgba(139,94,60,.2);transform:translateY(-2px);}
        .tipo-btn.activo i{color:var(--cafe-deep);}

        /* TABLA */
        .table-wrap{border-radius:var(--radius-lg);overflow:hidden;border:1.5px solid rgba(212,184,150,.22);}
        .table{margin:0;font-size:.88rem;}
        .table thead tr{background:linear-gradient(135deg,var(--cafe-deep),var(--cafe-dark));}
        .table thead th{padding:13px 16px;font-weight:600;letter-spacing:.03em;border:none;color:#fff;}
        .table tbody tr{cursor:pointer;transition:background .15s;}
        .table tbody tr:hover{background:rgba(212,184,150,.10);}
        .table tbody tr.fila-activa,
        .table tbody tr.table-active{background:rgba(212,184,150,.22)!important;}
        .table tbody td{padding:12px 16px;border-color:rgba(212,184,150,.18);vertical-align:middle;}
        .form-check-input{accent-color:var(--cafe-dark);}

        /* ACCIONES PANEL — slide animado */
        .acciones-panel{
            overflow:hidden;
            max-height:0;
            opacity:0;
            transition:max-height .4s cubic-bezier(.4,0,.2,1),
                        opacity .35s ease,
                        margin-top .3s ease;
            margin-top:0;
        }
        .acciones-panel.visible{max-height:100px;opacity:1;margin-top:20px;}
        .acciones-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:16px 18px;background:var(--crema-2);border:1.5px solid rgba(212,184,150,.3);border-radius:var(--radius-lg);}
        .seleccion-info{font-size:.82rem;color:var(--text-muted);display:flex;align-items:center;gap:7px;}
        .seleccion-info strong{color:var(--cafe-dark);}

        /* BOTONES acción */
        .btn-accion{display:inline-flex;align-items:center;gap:7px;padding:11px 20px;border-radius:var(--radius-md);font-family:'Poppins',sans-serif;font-weight:700;font-size:.86rem;border:none;cursor:pointer;transition:transform .2s,box-shadow .2s;white-space:nowrap;}
        .btn-accion:active{transform:scale(.96);}
        .btn-accion:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important;}
        .btn-edit{background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;box-shadow:0 4px 14px rgba(217,119,6,.25);}
        .btn-edit:hover:not(:disabled){box-shadow:0 8px 22px rgba(217,119,6,.35);transform:translateY(-2px);}
        .btn-del{background:linear-gradient(135deg,#EF4444,#B91C1C);color:#fff;box-shadow:0 4px 14px rgba(185,28,28,.22);}
        .btn-del:hover:not(:disabled){box-shadow:0 8px 22px rgba(185,28,28,.32);transform:translateY(-2px);}
        .btn-ins{background:linear-gradient(135deg,var(--cafe-dark),var(--cafe-deep));color:#fff;box-shadow:0 4px 14px rgba(92,51,23,.25);}
        .btn-ins:hover:not(:disabled){box-shadow:0 8px 22px rgba(92,51,23,.35);transform:translateY(-2px);}

        /* EMPTY STATE */
        .tabla-empty{text-align:center;padding:44px;color:var(--text-muted);}
        .tabla-empty i{font-size:2.5rem;display:block;margin-bottom:12px;opacity:.3;}
        .tabla-empty p{margin:0;font-size:.9rem;}

        /* BACK */
        .btn-back{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:var(--radius-md);font-family:'Poppins',sans-serif;font-weight:600;font-size:.88rem;background:transparent;color:var(--cafe-dark);border:2px solid rgba(139,94,60,.3);cursor:pointer;transition:background .2s,border-color .2s;text-decoration:none;}
        .btn-back:hover{background:var(--crema-2);border-color:var(--cafe-mid);color:var(--cafe-dark);}

        /* FOOTER */
        .footer-custom{background:rgba(255,255,255,.82);backdrop-filter:var(--blur);border-top:1.5px solid rgba(212,184,150,.22);padding:18px 32px;font-size:.82rem;color:var(--text-muted);text-align:center;}

        /* MODALES */
        .modal-content{border-radius:22px;background:rgba(253,250,246,.97);backdrop-filter:blur(22px);box-shadow:0 12px 40px rgba(92,51,23,.18);border:1.5px solid rgba(212,184,150,.25);animation:iosModalFade .35s ease;}
        @keyframes iosModalFade{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
        .modal-header{border-bottom:1px solid rgba(212,184,150,.2);background:transparent;}
        .modal-title{font-family:'Playfair Display',serif;font-weight:700;color:var(--cafe-ink);flex:1;text-align:center;}
        .modal-footer{border-top:1px solid rgba(212,184,150,.2);}
        .modal-footer .btn{border-radius:var(--radius-md);font-weight:600;padding:.65rem 1.4rem;}
        .btn-close{filter:invert(.4);opacity:.7;}
        .modal-body .form-label{font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);}
        .modal-body .form-control,.modal-body .form-select{border-radius:var(--radius-md);border:1.5px solid rgba(212,184,150,.45);background:rgba(255,255,255,.85);padding:11px 14px;font-family:'Poppins',sans-serif;font-size:.92rem;transition:border-color .2s,box-shadow .2s;}
        .modal-body .form-control:focus,.modal-body .form-select:focus{border-color:var(--cafe-mid);box-shadow:0 0 0 3px rgba(184,147,106,.18);outline:none;}
        .btn-modal-save{background:linear-gradient(135deg,var(--cafe-dark),var(--cafe-deep))!important;color:#fff!important;border:none!important;box-shadow:0 4px 14px rgba(92,51,23,.25)!important;}
        .btn-modal-save:hover{box-shadow:0 6px 20px rgba(92,51,23,.35)!important;}
        .btn-modal-cancel{background:#f0ebe4!important;color:var(--cafe-dark)!important;border:none!important;}
        .btn-modal-cancel:hover{background:var(--crema-2)!important;}

        /* ANIMACIONES */
        @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        @keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
        .row-enter{animation:fadeUp .22s ease both;}
    </style>
</head>

<body>

<!-- FRANJA IMAGEN -->
<header>
    <div class="hero-section" style="background-image: url('/img/granoscafe.jpg');">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-badge">
                <i class="bi bi-journal-bookmark-fill"></i> Gestión de Catálogo
            </div>
            <div class="hero-logo">
                <img th:src="@{/img/arboledasLogo.jpg}" alt="Logo">
            </div>
        </div>
    </div>
</header>

<!-- TÍTULO GRANDE -->
<div class="header-block">
    <div>
        <div class="header-eyebrow">Administración del menú</div>
        <h1 class="header-main-title">Catálogo <em>&amp; Productos</em></h1>
        <div class="header-divider"></div>
    </div>
</div>

<!-- MAIN -->
<main class="page-main">

    <!-- PASO 1: Tipo de gestión -->
    <div class="panel-card">
        <div class="panel-card-title">
            <i class="bi bi-grid-fill icon-badge"></i>
            ¿Qué deseas gestionar?
        </div>
        <div class="tipo-grid">
            <button class="tipo-btn" data-valor="1">
                <i class="bi bi-tags-fill"></i>
                Categorías
            </button>
            <button class="tipo-btn" data-valor="2">
                <i class="bi bi-diagram-3-fill"></i>
                Subcategorías
            </button>
            <button class="tipo-btn" data-valor="3">
                <i class="bi bi-cup-hot-fill"></i>
                Productos
            </button>
            <button class="tipo-btn" data-valor="4">
                <i class="bi bi-sliders"></i>
                Opciones
            </button>
        </div>
    </div>

    <!-- PASO 2: Tabla + Acciones (oculto hasta seleccionar tipo) -->
    <div class="panel-card" id="panelTabla" style="display:none;">

        <!-- Cabecera del panel -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;">
            <div class="panel-card-title" style="margin-bottom:0;">
                <i class="bi bi-table icon-badge"></i>
                <span id="tituloTabla">Resultados</span>
            </div>
            <button id="btnInsertar" class="btn-accion btn-ins">
                <i class="bi bi-plus-circle-fill"></i> Nuevo registro
            </button>
        </div>

        <!-- Tabla -->
        <div class="table-wrap" id="wrapTabla">
            <table class="table table-hover align-middle">
                <thead><tr id="tablaCatalogoHead"></tr></thead>
                <tbody id="tablaCatalogoBody"></tbody>
            </table>
        </div>

        <!-- Panel de acciones — aparece al seleccionar una fila -->
        <div class="acciones-panel" id="accionesPanel">
            <div class="acciones-inner">
                <div class="seleccion-info">
                    <i class="bi bi-check-circle-fill" style="color:var(--cafe-mid);font-size:1.05rem;"></i>
                    Seleccionado: <strong id="infoSeleccion">—</strong>
                </div>
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <button id="btnEditar" class="btn-accion btn-edit">
                        <i class="bi bi-pencil-fill"></i> Editar
                    </button>
                    <button id="btnEliminar" class="btn-accion btn-del">
                        <i class="bi bi-trash3-fill"></i> Eliminar
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Regresar -->
    <div class="d-flex justify-content-start mt-2 mb-4">
        <a href="/admin/inicio" class="btn-back">
            <i class="bi bi-arrow-left"></i> Regresar al inicio
        </a>
    </div>

</main>

<!-- FOOTER -->
<footer class="footer-custom">
    &copy; 2025 · Rincón Arboledas &mdash; Gestión de Catálogo.
</footer>

<!-- MODALES -->
<div th:replace="~{admin/Generales :: modalAlertas}"></div>
<div th:replace="~{admin/Generales :: modalConfirmacion}"></div>
<div th:replace="~{admin/Generales :: modalEliminar}"></div>
<div th:replace="~{admin/DetalleGestion :: modalEditar}"></div>
<div th:replace="~{admin/DetalleGestion :: modalInsertar}"></div>

<!-- Select oculto para compatibilidad con GestionCatalogo.js -->
<select id="tipoProceso" style="display:none;">
    <option value="1">Categorías</option>
    <option value="2">Subcategorías</option>
    <option value="3">Productos</option>
    <option value="4">Opciones de subcategoría</option>
</select>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" th:src="@{/js/Catalogo/GestionCatalogo.js}"></script>

<script>
(function () {

    const titulos = { 1:'Categorías', 2:'Subcategorías', 3:'Productos', 4:'Opciones de subcategoría' };
    const selectOculto = document.getElementById('tipoProceso');

    /* ── Botones tipo de gestión ── */
    document.querySelectorAll('.tipo-btn').forEach(btn => {
        btn.addEventListener('click', function () {
            document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('activo'));
            this.classList.add('activo');

            const val = this.dataset.valor;
            selectOculto.value = val;
            selectOculto.dispatchEvent(new Event('change'));   // GestionCatalogo.js escucha esto

            // Mostrar panel tabla con animación
            const panel = document.getElementById('panelTabla');
            panel.style.display = 'block';
            void panel.offsetWidth; // reflow para re-triggear animation
            panel.style.animation = 'none';
            requestAnimationFrame(() => { panel.style.animation = 'fadeUp .35s ease both'; });

            document.getElementById('tituloTabla').textContent = titulos[val] || 'Resultados';

            // Ocultar acciones al cambiar tipo
            document.getElementById('accionesPanel').classList.remove('visible');
            document.getElementById('infoSeleccion').textContent = '—';
        });
    });

    /* ── Observar cuándo GestionCatalogo.js habilita los botones de acción ──
       Cuando #btnEditar deja de estar disabled, mostramos el panel.
       Cuando vuelve a estar disabled (limpiarTabla), lo ocultamos.         */
    const btnEditar  = document.getElementById('btnEditar');
    const btnEliminar = document.getElementById('btnEliminar');
    const accionesPanel = document.getElementById('accionesPanel');

    const mutObs = new MutationObserver(() => {
        const habilitado = btnEditar && !btnEditar.disabled;
        if (habilitado) {
            accionesPanel.classList.add('visible');
        } else {
            accionesPanel.classList.remove('visible');
            document.getElementById('infoSeleccion').textContent = '—';
        }
    });

    if (btnEditar)   mutObs.observe(btnEditar,   { attributes: true, attributeFilter: ['disabled'] });
    if (btnEliminar) mutObs.observe(btnEliminar, { attributes: true, attributeFilter: ['disabled'] });

    /* ── Actualizar texto informativo al seleccionar fila ──
       Esperamos a que jQuery pinte la tabla y luego escuchamos click en las filas */
    document.addEventListener('click', function (e) {
        const tr = e.target.closest('tr.fila-catalogo');
        if (!tr) return;
        const cells = tr.querySelectorAll('td');
        // Segunda celda (índice 1) suele ser el ID o primer campo visible
        if (cells.length > 1) {
            const id   = cells[1]?.textContent?.trim() || '—';
            const name = cells[2]?.textContent?.trim() || '';
            document.getElementById('infoSeleccion').textContent = name ? `${name} (ID: ${id})` : `ID: ${id}`;
        }
    });

    /* ── Animación de filas al pintar tabla ──
       GestionCatalogo.js appenda <tr> en el DOM; aplicamos clase row-enter */
    const tbodyObs = new MutationObserver(mutations => {
        mutations.forEach(m => {
            m.addedNodes.forEach(node => {
                if (node.nodeType === 1 && node.matches('tr')) {
                    node.classList.add('row-enter');
                }
            });
        });
    });

    const tbody = document.getElementById('tablaCatalogoBody');
    if (tbody) tbodyObs.observe(tbody, { childList: true });

})();
</script>

</body>
</html>
