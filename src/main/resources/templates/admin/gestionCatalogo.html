<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Catálogo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/styleTomaOrden.css}">
</head>

<body>

<!-- HEADER -->
<header class="container-fluid px-0">
    <div class="hero-section" style="background-image: url('/img/granoscafe.jpg');">
        <div class="hero-overlay">
            <div class="container">
                <h1 class="hero-title">Gestión de Catálogo</h1>
                <p class="opacity-75">Administración de categorías, productos y opciones</p>
            </div>
        </div>
    </div>
</header>

<!-- MAIN -->
<main class="container card-main">

    <!-- PASO 1 -->
    <div class="glass-card p-4 mb-4">
        <h5 class="fw-bold mb-3">️⃣ ¿Qué deseas gestionar?</h5>

        <select id="tipoProceso" class="form-select">
            <option value="" selected disabled>Selecciona una opción</option>
            <option value="1">Categorías</option>
            <option value="2">Subcategorías</option>
            <option value="3">Productos</option>
            <option value="4">Opciones de subcategoría</option>
        </select>
    </div>
	<!-- PASO 2: TABLA DE RESULTADOS -->
	<div class="glass-card p-4 mb-4">
	    <h5 class="fw-bold mb-3">📋 Resultados</h5>

	    <div class="table-responsive">
	        <table class="table table-hover align-middle">
	            <thead class="table-dark">
	                <tr id="tablaCatalogoHead"></tr>
	            </thead>
	            <tbody id="tablaCatalogoBody"></tbody>
	        </table>
	    </div>
	</div>
	<div class="glass-card p-4 mb-4">
	    <h5 class="fw-bold mb-3">⚙️ Acciones</h5>

	    <div class="d-flex gap-2">
	        <button id="btnEditar" class="btn btn-warning" disabled>
	            ✏️ Editar
	        </button>

	        <button id="btnEliminar" class="btn btn-danger" disabled>
	            🗑️ Eliminar
	        </button>
	    </div>
	</div>

<!-- FOOTER -->
<footer class="footer-custom">
    <div class="container text-center">
        &copy; 2025 - Gestión de Catálogo
    </div>
</footer>

<!-- MODALES -->
<div th:replace="~{admin/Generales :: modalAlertas}"></div>
<div th:replace="~{admin/Generales :: modalConfirmacion}"></div>

<!-- LIBS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS EXTERNO -->
<script type="module" th:src="@{/js/Catalogo/GestionCatalogo.js}"></script>

</body>
</html>
