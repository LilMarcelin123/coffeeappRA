<!DOCTYPE html>
<!--
  admin/gestion/fragmentos.html
  Piezas compartidas por las pantallas del Modulo de Gestion.

  Estaban repetidas en las tres plantillas: el encabezado, la barra
  de periodo y el pie. Aqui viven una sola vez y cada pantalla las
  invoca con th:replace, pasandole lo suyo.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="cabeza(titulo, hojaPropia)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Módulo de Gestión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/temporada.css}">
    <link rel="stylesheet" th:href="@{/css/gestion/nucleo.css}">
    <link rel="stylesheet" th:href="@{'/css/gestion/' + ${hojaPropia} + '.css'}">
</head>

<body>

<!-- ── Cabeza del documento ────────────────────────────────────
     Recibe el titulo de la pestaña y la hoja de estilos propia de
     la pantalla; lo demas es igual en todas.                    -->



<!-- ── Encabezado ──────────────────────────────────────────── -->
<header th:fragment="encabezado(icono, titulo, bajada)">
    <div class="hero-section">
        <div class="hero-overlay"></div>
        <div th:if="${tema == 'halloween'}"
             th:replace="~{fragmentos/temporada :: halloween-banda}"></div>
        <div class="hero-content">
            <div class="hero-left">
                <span class="hero-badge">
                    <i class="bi" th:classappend="${icono}"></i> Módulo de Gestión
                </span>
                <h1 class="hero-title" th:text="${titulo}">Título</h1>
                <p class="hero-subtitle" th:text="${bajada}">Bajada</p>
            </div>
            <div class="hero-right">
                <div class="hero-logo-wrap">
                    <img th:src="@{/img/arboledasLogo.jpg}" alt="Logo de El Rincón en las Arboledas">
                </div>
                <p class="hero-negocio">Rincón Arboledas</p>
            </div>
        </div>
    </div>
</header>


<!-- ── Barra de periodo ────────────────────────────────────────
     `atajos` llega como "clave=Texto|clave=Texto"; se parte aqui
     para que el controlador no tenga que armar estructuras solo
     para pintar unos botones.                                  -->
<section th:fragment="periodo(atajos, volverA, volverTexto)"
         class="periodo vidrio" aria-label="Periodo a consultar">

    <span class="rotulo periodo__label">Periodo</span>

    <div class="periodo__chips" id="periodoChips">
        <button th:each="atajo : ${#strings.arraySplit(atajos, '|')}"
                type="button" class="chip"
                th:data-periodo="${#strings.substringBefore(atajo, '=')}">
            <span th:text="${#strings.substringAfter(atajo, '=')}">Hoy</span>
        </button>
    </div>

    <div class="periodo__rango" id="periodoRango">
        <input type="date" id="inputDesde" aria-label="Desde">
        <span>a</span>
        <input type="date" id="inputHasta" aria-label="Hasta">
    </div>

    <a th:href="@{${volverA}}" class="volver">
        <i class="bi bi-arrow-left"></i> <span th:text="${volverTexto}">Volver</span>
    </a>

    <p class="periodo__leyenda" id="periodoLeyenda">Cargando…</p>
</section>


<!-- ── Pie ─────────────────────────────────────────────────── -->
<footer th:fragment="pie" class="footer-custom">
    <div class="footer-inner">
        <span>&copy; 2026 · Rincón Arboledas. Todos los derechos reservados.</span>
        <div class="footer-powered">
            <span>Powered by</span>
            <img th:src="@{/img/isotipo_icarix.jpg}" alt="ICARIX" class="footer-icarix-logo">
            <span class="footer-icarix-name">ICARIX</span>
        </div>
    </div>
</footer>

</body>
</html>
