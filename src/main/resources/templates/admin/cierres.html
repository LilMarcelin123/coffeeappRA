<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/gestion/fragmentos :: cabeza('Cierres — Módulo de Gestión', 'cierres')}"></head>

<body class="gestion-body" th:attr="data-hoy-negocio=${hoyNegocio}">

<header th:replace="~{admin/gestion/fragmentos :: encabezado(
            'bi-cash-coin',
            'Cierres de caja',
            'Qué se vendió cada día y qué se arqueó en los cortes.')}"></header>

<main class="gestion-main">

    <section th:replace="~{admin/gestion/fragmentos :: periodo(
                'hoy=Hoy|7dias=7 días|mes=Este mes|rango=Rango',
                '/admin/gestion', 'Volver al módulo')}"></section>

    <!-- ── Resumen del periodo ────────────────────────────── -->
    <section class="tiras" id="resumenPeriodo" hidden>
        <div class="tira vidrio">
            <small class="rotulo">Vendido</small>
            <b class="cifra" id="totVendido">$0</b>
        </div>
        <div class="tira vidrio">
            <small class="rotulo">Arqueado en cortes</small>
            <b class="cifra" id="totArqueado">$0</b>
        </div>
        <div class="tira vidrio tira--alerta" id="tiraDiferencia" hidden>
            <small class="rotulo">Sin arquear</small>
            <b class="cifra" id="totDiferencia">$0</b>
        </div>
    </section>

    <!-- ── Días ───────────────────────────────────────────── -->
    <section class="dias" id="listaDias" aria-live="polite"></section>

    <!-- ── Plantillas ─────────────────────────────────────── -->
    <template id="tplDia">
        <article class="dia vidrio">
            <button class="dia__cabecera" type="button" aria-expanded="false">
                <span class="dia__fecha">
                    <b class="dia__titulo"></b>
                    <span class="dia__semana"></span>
                </span>

                <span class="dia__cifras">
                    <span class="dia__cifra">
                        <small>Venta</small>
                        <b class="dia__venta cifra"></b>
                    </span>
                    <span class="dia__cifra">
                        <small>Órdenes</small>
                        <b class="dia__ordenes cifra"></b>
                    </span>
                    <span class="dia__cifra dia__cifra--cortes">
                        <small>Cortes</small>
                        <b class="dia__cortes cifra"></b>
                    </span>
                </span>

                <span class="dia__estado">
                    <span class="pastilla"></span>
                    <i class="bi bi-chevron-down dia__chevron"></i>
                </span>
            </button>

            <div class="dia__detalle" hidden>
                <div class="pagos">
                    <span><i class="bi bi-cash"></i> Efectivo <b class="pago-efectivo cifra"></b></span>
                    <span><i class="bi bi-credit-card"></i> Tarjeta <b class="pago-tarjeta cifra"></b></span>
                    <span><i class="bi bi-arrow-left-right"></i> Otro <b class="pago-otro cifra"></b></span>
                </div>
                <div class="cortes"></div>
            </div>
        </article>
    </template>

    <template id="tplCorte">
        <div class="corte">
            <span class="corte__hora cifra">
                <i class="bi bi-clock-history"></i><span class="corte__hora-txt"></span>
            </span>
            <span class="corte__datos">
                <span class="corte__usuario"></span>
                <span class="corte__ordenes"></span>
            </span>
            <b class="corte__total cifra"></b>
            <p class="corte__nota"></p>
        </div>
    </template>

</main>

<footer th:replace="~{admin/gestion/fragmentos :: pie}"></footer>

<script type="module" th:src="@{/js/Gestion/cierres.js}"></script>

</body>
</html>
