spring.application.name=coffee_app_rincon_arboledas
server.address=0.0.0.0
server.port=${PORT:8085}
evolution.api.url=http://localhost:8080
##server.port=${PORT:8080}
#server.port=${PORT:3033}

spring.datasource.url=jdbc:mariadb://localhost:3307/bd_rincon_arboleda?serverTimezone=America/Mexico_City&connectionTimeZone=America/Mexico_City
spring.datasource.username=coffee_user
spring.datasource.password=coffee_pass
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.main.allow-circular-references=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.servlet.session.timeout=480m
server.servlet.session.cookie.max-age=28800
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-test-query=SELECT 1


evolution.api.key=
evolution.api.instance=cafeteria-rincon


app.url=http://localhost:8085

ai.api.key=
ai.model=gemini-2.5-flash
ai.api.url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions

# ── Configuracion del negocio (por cliente) ──
# Estos cuatro son lo unico que cambia entre un cliente y otro: el
# mismo jar sirve para todos. En Railway los pisa la variable de
# entorno (NEGOCIO_NOMBRE, NEGOCIO_LOGO, ...) sin ayuda.
# La AE va escapada a proposito. Spring lee los .properties como
# ISO-8859-1, asi que un caracter UTF-8 escrito tal cual llega
# partido en dos y la pantalla acaba diciendo "DAEDAX" mal.
negocio.nombre=D\u00C6DAX
negocio.direccion=Xochimilco, Ciudad de Mexico
negocio.horario=Lunes a Domingo
negocio.logo=/img/daedax-logo.svg
negocio.portada=/img/daedax-fondo.svg

# ── Modulo WhatsApp (bot IA). false = desactivado para este cliente ──
whatsapp.enabled=false

# Cierre automatico del dia (01:00 America/Mexico_City)
cierre.automatico.enabled=true

# Decoracion de temporada: auto | halloween | ninguna
# auto la enciende del 1 de octubre al 2 de noviembre.
# Ponla en halloween para verla fuera de esas fechas.
app.temporada=ninguna

# ── Ambiente ──────────────────────────────────────────────────
# Ojo con este bloque y con los de arriba: NO les pongas
# ${VARIABLE:} para leer el entorno. Spring Boot ya mapea solo
# AI_API_KEY a ai.api.key, asi que ese marcador termina
# buscandose a si mismo ("circular placeholder reference") y la
# aplicacion no arranca. El valor de aqui es el de desarrollo; en
# Railway la variable de entorno lo pisa sin ayuda.
# produccion | staging | demo. Fuera de produccion la pantalla lleva
# una banda visible: dos ambientes identicos es como alguien acaba
# cobrando una orden real en el de pruebas. En demo la banda es la de
# DAEDAX, porque esa pantalla se le ensena a un prospecto.
app.ambiente=demo
