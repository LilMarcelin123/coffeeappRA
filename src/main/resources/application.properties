spring.application.name=coffee_app_rincon_arboledas
server.address=0.0.0.0
#server.port=3033

server.port=8080



spring.datasource.url=jdbc:mariadb://localhost:3307/bd_rincon_arboleda?serverTimezone=America/Mexico_City&connectionTimeZone=America/Mexico_City
spring.datasource.username=coffee_user
spring.datasource.password=coffee_pass
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect


spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.main.allow-circular-references=true




spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.servlet.session.timeout=480m
server.servlet.session.cookie.max-age=28800
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Tiempo máximo esperando una conexión del pool
spring.datasource.hikari.connection-timeout=30000

# Tiempo máximo que una conexión puede estar inactiva antes de cerrarse
spring.datasource.hikari.idle-timeout=600000

# Tiempo máximo de vida de una conexión
spring.datasource.hikari.max-lifetime=1800000

# Tamaño del pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Query para validar que la conexión sigue viva
spring.datasource.hikari.connection-test-query=SELECT 1
